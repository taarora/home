<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Expedition Log — Photography Trip Planner</title>
<style>
  :root {
    --paper: #ede8dc;
    --paper-raised: #f8f5ec;
    --paper-sunken: #e2ddce;
    --ink: #232920;
    --ink-soft: #5c6353;
    --ink-faint: #8c8875;
    --rule: #d6cfba;
    --rule-strong: #c2b99f;
    --accent: #2b5a56;
    --accent-soft: #cfe0da;
    --accent-contrast: #f8f5ec;
    --status-idea: #918c78;
    --status-planned: #b9793a;
    --status-confirmed: #3e6fa8;
    --danger: #a8433a;
    --shadow: 0 1px 2px rgba(35,41,32,0.06), 0 4px 14px rgba(35,41,32,0.07);
    --font-display: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
    --font-body: "Seravek", "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "SF Mono", "Cascadia Mono", Consolas, Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #171b13;
      --paper-raised: #1f2419;
      --paper-sunken: #12150f;
      --ink: #e9e4d3;
      --ink-soft: #aca88f;
      --ink-faint: #726e5c;
      --rule: #363c2b;
      --rule-strong: #454b37;
      --accent: #7fc2ba;
      --accent-soft: #263a35;
      --accent-contrast: #12160f;
      --status-idea: #a19c86;
      --status-planned: #dd9d55;
      --status-confirmed: #74a5db;
      --danger: #d3776d;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 20px rgba(0,0,0,0.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #171b13; --paper-raised: #1f2419; --paper-sunken: #12150f;
    --ink: #e9e4d3; --ink-soft: #aca88f; --ink-faint: #726e5c;
    --rule: #363c2b; --rule-strong: #454b37;
    --accent: #7fc2ba; --accent-soft: #263a35; --accent-contrast: #12160f;
    --status-idea: #a19c86; --status-planned: #dd9d55; --status-confirmed: #74a5db;
    --danger: #d3776d;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --paper: #ede8dc; --paper-raised: #f8f5ec; --paper-sunken: #e2ddce;
    --ink: #232920; --ink-soft: #5c6353; --ink-faint: #8c8875;
    --rule: #d6cfba; --rule-strong: #c2b99f;
    --accent: #2b5a56; --accent-soft: #cfe0da; --accent-contrast: #f8f5ec;
    --status-idea: #918c78; --status-planned: #b9793a; --status-confirmed: #3e6fa8;
    --danger: #a8433a;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent-soft); }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { max-width: 1180px; margin: 0 auto; padding: 28px 28px 64px; }

  /* ---------- Header ---------- */
  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    flex-wrap: wrap;
    padding-bottom: 18px;
    border-bottom: 2px solid var(--ink);
    margin-bottom: 20px;
  }
  .masthead-title .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    display: block;
    margin-bottom: 4px;
  }
  .masthead-title h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 34px;
    margin: 0;
    text-wrap: balance;
    letter-spacing: 0.01em;
  }
  .masthead-title p {
    margin: 4px 0 0;
    color: var(--ink-soft);
    font-size: 13.5px;
  }
  .masthead-title p strong { color: var(--ink); font-weight: 600; }

  .masthead-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  .year-nav {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-display);
    font-size: 20px;
    font-variant-numeric: tabular-nums;
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 4px 6px;
  }
  .year-nav button {
    width: 28px; height: 28px;
    border-radius: 6px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 15px;
    display: flex; align-items: center; justify-content: center;
  }
  .year-nav button:hover { background: var(--accent-soft); color: var(--accent); }
  .year-nav .range { padding: 0 4px; white-space: nowrap; }
  .year-nav select.range {
    font: inherit;
    font-family: var(--font-display);
    font-size: 20px;
    font-variant-numeric: tabular-nums;
    border: none;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    appearance: none;
  }
  .year-nav select.range:hover { color: var(--accent); }

  .btn {
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 7px;
    border: 1px solid var(--rule-strong);
    background: var(--paper-raised);
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
    transition: background 120ms ease, transform 80ms ease;
  }
  .btn:hover { background: var(--accent-soft); }
  .btn:active { transform: translateY(1px); }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-contrast);
  }
  .btn-primary:hover { filter: brightness(1.08); background: var(--accent); }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--ink-soft); }
  .btn-ghost:hover { background: var(--paper-sunken); color: var(--ink); }
  .btn-danger { color: var(--danger); border-color: transparent; background: transparent; }
  .btn-danger:hover { background: rgba(168,67,58,0.12); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ---------- Legend + summary line ---------- */
  .subbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 18px;
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  /* ---------- Unscheduled tray ---------- */
  .tray {
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 22px;
  }
  .tray-head {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 10px;
  }
  .tray-head .count {
    background: var(--paper-sunken);
    border-radius: 20px;
    padding: 1px 8px;
    font-family: var(--font-body);
    letter-spacing: 0;
    text-transform: none;
    color: var(--ink-soft);
  }
  .tray-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    min-height: 46px;
  }
  .tray-row.drag-over { outline: 2px dashed var(--accent); outline-offset: 4px; border-radius: 8px; }
  .tray-empty { color: var(--ink-faint); font-size: 13px; font-style: italic; padding: 10px 2px; }

  /* ---------- Calendar grid ---------- */
  .cal-scroll { overflow-x: auto; padding-bottom: 4px; }
  .cal {
    display: grid;
    grid-template-columns: 56px repeat(3, minmax(190px, 1fr));
    min-width: 700px;
    border-top: 1px solid var(--rule-strong);
    border-left: 1px solid var(--rule-strong);
  }
  .cal-corner {
    border-bottom: 1px solid var(--rule-strong);
    border-right: 1px solid var(--rule-strong);
    background: var(--paper);
  }
  .cal-yearhead {
    padding: 6px 12px 10px;
    border-bottom: 1px solid var(--rule-strong);
    border-right: 1px solid var(--rule-strong);
    font-family: var(--font-display);
    font-size: 22px;
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .cal-yearhead .trip-count { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); }
  .cal-monthlabel {
    position: sticky;
    left: 0;
    background: var(--paper);
    border-bottom: 1px solid var(--rule);
    border-right: 1px solid var(--rule-strong);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--ink-faint);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
  }
  .cell {
    position: relative;
    border-bottom: 1px solid var(--rule);
    border-right: 1px solid var(--rule-strong);
    background: var(--paper-raised);
    min-height: 78px;
    padding: 6px 7px 7px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .cell.drag-over { background: var(--accent-soft); }
  .cell.is-today { box-shadow: inset 0 0 0 2px var(--accent); }
  .cell-add {
    position: absolute;
    top: 4px; right: 4px;
    width: 18px; height: 18px;
    border-radius: 5px;
    border: 1px solid var(--rule-strong);
    background: var(--paper-raised);
    color: var(--ink-faint);
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity 100ms ease;
  }
  .cell:hover .cell-add, .cell:focus-within .cell-add { opacity: 1; }
  .cell-add:hover { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }
  .cell-chips { display: flex; flex-direction: column; gap: 4px; margin-top: 14px; }

  .chip {
    background: color-mix(in srgb, var(--status-color, var(--accent)) 14%, var(--paper-raised));
    border: 1px solid color-mix(in srgb, var(--status-color, var(--accent)) 32%, var(--rule-strong));
    border-left: 3px solid var(--status-color, var(--accent));
    border-radius: 5px;
    padding: 4px 7px;
    cursor: grab;
    box-shadow: var(--shadow);
  }
  .chip:active { cursor: grabbing; }
  .chip.dragging { opacity: 0.4; }
  .chip-title {
    display: block;
    font-weight: 600;
    font-size: 12.5px;
    line-height: 1.25;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chip-loc {
    display: block;
    font-size: 11px;
    color: var(--ink-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tray-row .chip { min-width: 150px; max-width: 220px; }

  /* ---------- Modal ---------- */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(20,23,16,0.45);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 40px 16px;
    overflow-y: auto;
    z-index: 50;
  }
  .modal-backdrop[hidden] { display: none; }
  .modal {
    background: var(--paper-raised);
    border-radius: 12px;
    border: 1px solid var(--rule-strong);
    width: 100%;
    max-width: 640px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 22px;
    border-bottom: 1px solid var(--rule);
  }
  .modal-head h2 {
    font-family: var(--font-display);
    font-size: 19px;
    margin: 0;
  }
  .modal-close {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink-soft);
    font-size: 16px;
    cursor: pointer;
  }
  .modal-close:hover { background: var(--paper-sunken); color: var(--ink); }
  .modal-body { padding: 4px 22px 6px; max-height: 72vh; overflow-y: auto; }
  .modal-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 22px 18px;
    border-top: 1px solid var(--rule);
  }
  .modal-foot .right { display: flex; gap: 8px; }

  section.field-group { padding: 16px 0; border-bottom: 1px solid var(--rule); }
  section.field-group:last-child { border-bottom: none; }
  .group-label {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 10px;
  }
  .row { display: flex; gap: 10px; margin-bottom: 8px; }
  .row:last-child { margin-bottom: 0; }
  .field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
  .field label { font-size: 11.5px; color: var(--ink-soft); }
  input[type="text"], input[type="url"], input[type="number"], select, textarea {
    font-family: var(--font-body);
    font-size: 13.5px;
    padding: 7px 9px;
    border-radius: 6px;
    border: 1px solid var(--rule-strong);
    background: var(--paper);
    color: var(--ink);
    width: 100%;
  }
  textarea { resize: vertical; min-height: 54px; font-family: var(--font-body); }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }

  .status-select-wrap { position: relative; }
  select#f-status { appearance: none; padding-right: 26px; }

  .tags {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px;
  }
  .tag {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 20px;
    padding: 3px 6px 3px 10px;
    font-size: 12px;
    font-weight: 600;
  }
  .tag button {
    border: none; background: transparent; color: inherit; cursor: pointer;
    width: 16px; height: 16px; border-radius: 50%; display:flex; align-items:center; justify-content:center;
    font-size: 12px; opacity: 0.7;
  }
  .tag button:hover { opacity: 1; background: rgba(0,0,0,0.1); }

  .repeat-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .repeat-row input { flex: 1; }
  .icon-btn {
    width: 26px; height: 26px;
    flex-shrink: 0;
    border-radius: 6px;
    border: 1px solid var(--rule-strong);
    background: var(--paper);
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 13px;
  }
  .icon-btn:hover { background: var(--paper-sunken); color: var(--danger); }
  .add-row-btn {
    font-size: 12px;
    color: var(--accent);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 0;
    font-weight: 600;
  }
  .add-row-btn:hover { text-decoration: underline; }
  .link-list a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid var(--accent-soft);
  }

  .budget-row { display: grid; grid-template-columns: 110px 90px 1fr; gap: 8px; }

  .photo-gallery { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
  .photo-card { width: 96px; }
  .photo-card img {
    width: 96px; height: 72px; object-fit: cover;
    border-radius: 6px; border: 1px solid var(--rule-strong);
    display: block; cursor: zoom-in;
  }
  .photo-card input {
    margin-top: 4px; font-size: 10.5px; padding: 3px 5px;
  }
  .photo-card .icon-btn { width: 100%; margin-top: 4px; }
  .upload-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; font-weight: 600; color: var(--accent);
    cursor: pointer; padding: 6px 0;
  }
  .upload-btn input { display: none; }

  .lightbox {
    position: fixed; inset: 0; background: rgba(10,12,8,0.85);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 30px;
  }
  .lightbox[hidden] { display: none; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; }

  .toast {
    position: fixed; bottom: 22px; right: 22px;
    background: var(--ink); color: var(--paper);
    padding: 10px 16px; border-radius: 8px;
    font-size: 13px; box-shadow: var(--shadow);
    opacity: 0; transform: translateY(8px);
    transition: opacity 180ms ease, transform 180ms ease;
    pointer-events: none;
    z-index: 200;
    max-width: 320px;
  }
  :root[data-theme="dark"] .toast, @media (prefers-color-scheme: dark) { }
  .toast.show { opacity: 1; transform: translateY(0); }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0);
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  @media (max-width: 720px) {
    .app { padding: 18px 14px 48px; }
    .masthead-title h1 { font-size: 26px; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="masthead">
    <div class="masthead-title">
      <span class="eyebrow">Field Log · Photography Trips</span>
      <h1>Expedition Planner</h1>
      <p id="summaryLine">Loading&hellip;</p>
    </div>
    <div class="masthead-actions">
      <div class="year-nav">
        <button id="prevYear" aria-label="Show earlier years">‹</button>
        <select class="range" id="yearRange" aria-label="Jump to a year range"></select>
        <button id="nextYear" aria-label="Show later years">›</button>
      </div>
      <button class="btn" id="todayBtn">Today</button>
      <button class="btn btn-primary" id="newTripBtn">+ New Trip</button>
      <button class="btn btn-ghost" id="exportBtn">Export JSON</button>
      <button class="btn btn-ghost" id="importBtn">Import JSON</button>
      <input type="file" id="importFile" accept="application/json" class="visually-hidden" />
      <button class="btn btn-ghost" id="exportCsvBtn">Export CSV</button>
      <button class="btn btn-ghost" id="importCsvBtn">Import CSV</button>
      <input type="file" id="importCsvFile" accept=".csv,text/csv" class="visually-hidden" />
    </div>
  </header>

  <div class="subbar">
    <div class="legend">
      <span><span class="dot" style="background:var(--status-idea)"></span>Idea</span>
      <span><span class="dot" style="background:var(--status-planned)"></span>Planned</span>
      <span><span class="dot" style="background:var(--status-confirmed)"></span>Confirmed</span>
    </div>
    <span>Drag a trip onto any month to reschedule it, or into the tray to unschedule it.</span>
  </div>

  <div class="tray" id="tray">
    <div class="tray-head"><span>Unscheduled ideas</span><span class="count" id="trayCount">0</span></div>
    <div class="tray-row" id="trayRow" data-year="" data-month=""></div>
  </div>

  <div class="cal-scroll">
    <div class="cal" id="cal"></div>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h2 id="modalTitle">New trip</h2>
      <button class="modal-close" id="modalCloseBtn" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn btn-danger" id="deleteTripBtn">Delete trip</button>
      <div class="right">
        <button class="btn btn-ghost" id="cancelTripBtn">Cancel</button>
        <button class="btn btn-primary" id="saveTripBtn">Save trip</button>
      </div>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox" hidden>
  <img id="lightboxImg" src="" alt="Inspiration photo" />
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "expeditionPlanner.v1";
  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var STATUSES = [
    { value: "idea", label: "Idea" },
    { value: "planned", label: "Planned" },
    { value: "confirmed", label: "Confirmed" }
  ];

  function uid() {
    return "t_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
  }

  function escapeHtml(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function blankTrip(year, month) {
    return {
      id: uid(),
      title: "",
      status: "idea",
      year: year || null,
      month: month || null,
      dates: "",
      groupSize: "",
      locations: "",
      species: [],
      budget: { amount: "", currency: "USD", notes: "" },
      links: [],
      operators: [],
      photos: [],
      refLinks: [],
      notes: ""
    };
  }

  function seedData() {
    return [
      {
        id: uid(), title: "Svalbard: Polar Bears & Pack Ice", status: "confirmed",
        year: 2026, month: 3, dates: "14–24 Mar", groupSize: "6 photographers",
        locations: "Longyearbyen, Svalbard\nPack ice edge, north of 80°N (ship-based)",
        species: ["Polar bear", "Walrus", "Arctic fox", "Ivory gull"],
        budget: { amount: "9200", currency: "USD", notes: "Per person, excl. flights to Oslo/Longyearbyen" },
        links: [{ label: "Sea ice concentration charts", url: "https://example.com/svalbard-ice-charts" }],

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.trips)) return parsed;
      }
    } catch (e) { /* fall through to seed */ }
    return { startYear: new Date().getFullYear(), trips: seedData() };
  }

  var state = loadState();
  var draft = null;
  var dragId = null;

  function persist() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      toast("Couldn't save — storage may be full (try smaller photos).");
    }
  }

  function toast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove("show"); }, 2600);
  }

  // ---------- Rendering ----------

  function render() {
    renderYearRange();
    renderSummary();
    renderTray();
    renderCalendar();
    persist();
  }

  function renderYearRange() {
    var sel = document.getElementById("yearRange");
    if (!sel.dataset.populated) {
      var current = new Date().getFullYear();
      var opts = "";
      for (var y = current - 5; y <= current + 15; y++) {
        opts += '<option value="' + y + '">' + y + "–" + (y + 2) + "</option>";
      }
      sel.innerHTML = opts;
      sel.dataset.populated = "1";
    }
    if (!sel.querySelector('option[value="' + state.startYear + '"]')) {
      var opt = document.createElement("option");
      opt.value = state.startYear;
      opt.textContent = state.startYear + "–" + (state.startYear + 2);
      sel.appendChild(opt);
    }
    sel.value = state.startYear;
  }

  function renderSummary() {
    var scheduled = state.trips.filter(function (t) { return t.year && t.month; });
    var today = new Date();
    var upcoming = scheduled
      .filter(function (t) {
        return t.year > today.getFullYear() || (t.year === today.getFullYear() && t.month >= today.getMonth() + 1);
      })
      .sort(function (a, b) { return (a.year - b.year) || (a.month - b.month); })[0];
    var line = state.trips.length + " trip" + (state.trips.length === 1 ? "" : "s") + " logged";
    if (upcoming) {
      line += " &middot; next up: <strong>" + escapeHtml(upcoming.title) + "</strong> in " + MONTHS[upcoming.month - 1] + " " + upcoming.year;
    }
    document.getElementById("summaryLine").innerHTML = line;
  }

  function chipHtml(trip) {
    var statusVar = "var(--status-" + trip.status + ")";
    var loc = (trip.locations || "").split("\n")[0] || "";
    return '<div class="chip" draggable="true" tabindex="0" role="button" ' +
      'aria-label="' + escapeHtml(trip.title || "Untitled trip") + '" data-id="' + trip.id + '" ' +
      'style="--status-color:' + statusVar + '">' +
      '<span class="chip-title">' + escapeHtml(trip.title || "Untitled trip") + "</span>" +
      (loc ? '<span class="chip-loc">' + escapeHtml(loc) + "</span>" : "") +
      "</div>";
  }

  function renderTray() {
    var unscheduled = state.trips.filter(function (t) { return !t.year || !t.month; });
    document.getElementById("trayCount").textContent = unscheduled.length;
    var row = document.getElementById("trayRow");
    row.innerHTML = unscheduled.length
      ? unscheduled.map(chipHtml).join("")
      : '<div class="tray-empty">No unscheduled ideas — drag a trip here to take it off the calendar, or add a new one.</div>';
  }

  function renderCalendar() {
    var cal = document.getElementById("cal");
    var years = [state.startYear, state.startYear + 1, state.startYear + 2];
    var today = new Date();
    var html = '<div class="cal-corner"></div>';

    years.forEach(function (y) {
      var count = state.trips.filter(function (t) { return t.year === y; }).length;
      html += '<div class="cal-yearhead">' + y + '<span class="trip-count">' + count + ' trip' + (count === 1 ? "" : "s") + '</span></div>';
    });

    for (var m = 1; m <= 12; m++) {
      html += '<div class="cal-monthlabel">' + MONTHS[m - 1] + "</div>";
      years.forEach(function (y) {
        var isToday = y === today.getFullYear() && m === today.getMonth() + 1;
        var tripsHere = state.trips.filter(function (t) { return t.year === y && t.month === m; });
        html += '<div class="cell' + (isToday ? " is-today" : "") + '" data-year="' + y + '" data-month="' + m + '">' +
          '<button class="cell-add" data-year="' + y + '" data-month="' + m + '" aria-label="Add trip in ' + MONTHS[m - 1] + " " + y + '">+</button>' +
          '<div class="cell-chips">' + tripsHere.map(chipHtml).join("") + "</div>" +
          "</div>";
      });
    }
    cal.innerHTML = html;

    dropzone.classList.add("drag-over");

  document.addEventListener("dragleave", function (e) {

  document.addEventListener("drop", function (e) {
    var dropzone = e.target.closest(".cell, #trayRow");
    if (!dropzone) return;
    e.preventDefault();
    dropzone.classList.remove("drag-over");
    var id = e.dataTransfer.getData("text/plain") || dragId;
    var trip = state.trips.find(function (t) { return t.id === id; });
    if (!trip) return;
    var y = dropzone.dataset.year ? parseInt(dropzone.dataset.year, 10) : null;
    var m = dropzone.dataset.month ? parseInt(dropzone.dataset.month, 10) : null;
    trip.year = y || null;
    trip.month = m || null;
    dragId = null;
    render();
  });

  // ---------- CSV export/import (Excel-compatible) ----------

  var CSV_HEADERS = ["Title","Status","Year","Month","Dates","Group Size","Locations","Key Species","Budget Amount","Budget Currency","Budget Notes","Links","Operators","Reference Links","Notes"];

  function csvEscape(field) {
    var s = field === undefined || field === null ? "" : String(field);
    if (/[",\r\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function joinPairs(items, keys) {
    return (items || []).map(function (item) {
      var parts = keys.map(function (k) { return item[k] || ""; });
      while (parts.length && !parts[parts.length - 1]) parts.pop();
      return parts.join(" - ");
    }).join("; ");
  }

  function splitPairs(str, keys) {
    if (!str) return [];
    return str.split(";").map(function (s) { return s.trim(); }).filter(Boolean).map(function (chunk) {
      var parts = chunk.split(" - ");
      var obj = {};
      keys.forEach(function (k, i) {
        obj[k] = i === keys.length - 1 ? parts.slice(i).join(" - ").trim() : (parts[i] || "").trim();
      });
      return obj;
    });
  }

  function exportCsv() {
    var lines = [CSV_HEADERS.map(csvEscape).join(",")];
    state.trips.forEach(function (t) {
      lines.push([
        csvEscape(t.title),
        csvEscape(t.status),
        csvEscape(t.year || ""),
        csvEscape(t.month || ""),
        csvEscape(t.dates),
        csvEscape(t.groupSize),
        csvEscape(t.locations),
        csvEscape((t.species || []).join("; ")),
        csvEscape(t.budget && t.budget.amount),
        csvEscape(t.budget && t.budget.currency),
        csvEscape(t.budget && t.budget.notes),
        csvEscape(joinPairs(t.links, ["label", "url"])),
        csvEscape(joinPairs(t.operators, ["name", "url", "contact"])),
        csvEscape(joinPairs(t.refLinks, ["label", "url"])),
        csvEscape(t.notes)
      ].join(","));
    });
    var blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "expedition-planner-" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    toast("Exported to CSV file.");
  }

  function parseCsv(text) {
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    var rows = [], row = [], field = "", inQuotes = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (inQuotes) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else { inQuotes = false; } }
        else field += c;
      } else {
        if (c === '"') inQuotes = true;
        else if (c === ",") { row.push(field); field = ""; }
        else if (c === "\r") { /* skip */ }
        else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
        else field += c;
      }
    }
    if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
    return rows.filter(function (r) { return r.length > 1 || (r[0] && r[0].trim() !== ""); });
  }

  function importCsvText(text) {
    var rows = parseCsv(text);
    if (rows.length < 2) { toast("No trip rows found in that CSV."); return; }
    var header = rows[0].map(function (h) { return h.trim().toLowerCase(); });
    var idx = {};
    header.forEach(function (h, i) { idx[h] = i; });

    var imported = rows.slice(1).map(function (r) {
      return {
        id: uid(),
        title: r[idx["title"]] || "Untitled trip",
        status: (r[idx["status"]] || "idea").toLowerCase(),
        year: r[idx["year"]] ? parseInt(r[idx["year"]], 10) : null,
        month: r[idx["month"]] ? parseInt(r[idx["month"]], 10) : null,
        dates: r[idx["dates"]] || "",
        groupSize: r[idx["group size"]] || "",
        locations: r[idx["locations"]] || "",
        species: (r[idx["key species"]] || "").split(";").map(function (s) { return s.trim(); }).filter(Boolean),
        budget: {
          amount: r[idx["budget amount"]] || "",
          currency: r[idx["budget currency"]] || "USD",
          notes: r[idx["budget notes"]] || ""
        },
        links: splitPairs(r[idx["links"]], ["label", "url"]),
        operators: splitPairs(r[idx["operators"]], ["name", "url", "contact"]),
        photos: [],
        refLinks: splitPairs(r[idx["reference links"]], ["label", "url"]),
        notes: r[idx["notes"]] || ""
      };
    });

    if (!confirm("Import " + imported.length + " trip(s) from CSV? They'll be added to your current trips.")) return;
    state.trips = state.trips.concat(imported);
    render();
    toast("Imported " + imported.length + " trip(s) from CSV.");
  }

    var reader = new FileReader();

    e.target.value = "";
  });

        '<img src="' + p.dataUrl + '" data-action="zoom" alt="' + escapeHtml(p.caption || "Inspiration photo") + '" />' +
        '<input type="text" class="photo-caption" value="' + escapeHtml(p.caption) + '" placeholder="Caption" data-index="' + i + '" />' +
        '<button class="icon-btn" data-action="remove-photo" data-index="' + i + '">Remove</button>' +
      "</div>";
    }).join("");
    return '<section class="field-group">' +
      '<p class="group-label">Inspiration</p>' +
      '<label class="upload-btn">&uarr; Upload photos<input type="file" id="photoUpload" accept="image/*" multiple /></label>' +
      '<div class="photo-gallery" id="photoGallery">' + photosHtml + "</div>" +
      '<div style="margin-top:14px"><label style="font-size:11.5px;color:var(--ink-soft)">Reference links (portfolios, galleries)</label>' +
      '<div id="refLinkList">' + repeatListHtml(t.refLinks, "refLink") + "</div>" +
      '<button class="add-row-btn" data-action="add-refLink">+ Add reference link</button></div>' +
    "</section>";
  }

  function fieldGroupNotes(t) {
    return '<section class="field-group">' +
      '<p class="group-label">Notes</p>' +
      '<textarea id="f-notes" placeholder="Itinerary ideas, best light times, gear reminders…">' + escapeHtml(t.notes) + "</textarea>" +
    "</section>";
  }

  function renderSpeciesTags() {
    var wrap = document.getElementById("speciesTags");
    wrap.innerHTML = draft.species.map(function (sp, i) {
      return '<span class="tag">' + escapeHtml(sp) + '<button data-action="remove-species" data-index="' + i + '" aria-label="Remove ' + escapeHtml(sp) + '">&times;</button></span>';
    }).join("");
  }

  function renderModalBody() {
    var body = document.getElementById("modalBody");
    body.innerHTML =
      fieldGroupOverview(draft) +
      fieldGroupLocSpecies(draft) +
      fieldGroupBudget(draft) +
      fieldGroupLinks(draft) +
      fieldGroupOperators(draft) +
      fieldGroupInspiration(draft) +
      fieldGroupNotes(draft);
    renderSpeciesTags();
  }

  function openModal(trip) {
    draft = JSON.parse(JSON.stringify(trip));
    modalDirty = false;
    document.getElementById("modalTitle").textContent = trip.title ? "Edit trip" : "New trip";
    document.getElementById("deleteTripBtn").style.visibility = state.trips.some(function (t) { return t.id === draft.id; }) ? "visible" : "hidden";
    renderModalBody();
    modalBackdrop.hidden = false;
    setTimeout(function () {
      var titleInput = document.getElementById("f-title");
      if (titleInput) titleInput.focus();
    }, 0);
  }

  function closeModalConfirmed() {
    modalBackdrop.hidden = true;
    draft = null;
  }

  function attemptClose() {
    if (modalDirty && !confirm("Discard unsaved changes to this trip?")) return;
    closeModalConfirmed();
  }

  document.getElementById("modalCloseBtn").addEventListener("click", attemptClose);
  document.getElementById("cancelTripBtn").addEventListener("click", attemptClose);
  modalBackdrop.addEventListener("click", function (e) {
    if (e.target === modalBackdrop) attemptClose();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !modalBackdrop.hidden) attemptClose();
  });

  document.getElementById("modalBody").addEventListener("input", function () { modalDirty = true; });

  // species tag input
  document.getElementById("modalBody").addEventListener("keydown", function (e) {
    if (e.target.id === "f-species-input" && (e.key === "Enter" || e.key === ",")) {
      e.preventDefault();
      var val = e.target.value.trim().replace(/,$/, "");
      if (val) {
        draft.species.push(val);
        e.target.value = "";
        renderSpeciesTags();
        modalDirty = true;
      }
    }
  });

  // delegated actions inside modal body
  document.getElementById("modalBody").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-action]");
    if (!btn) {
      if (e.target.dataset.action === "zoom") openLightbox(e.target.src);
      return;
    }
    var action = btn.dataset.action;
    var idx = btn.dataset.index !== undefined ? parseInt(btn.dataset.index, 10) : null;
    modalDirty = true;

    if (action === "remove-species") { draft.species.splice(idx, 1); renderSpeciesTags(); }
    else if (action === "add-link") { draft.links.push({ label: "", url: "" }); renderRepeatSection("linkList", draft.links, "link"); }
    else if (action === "remove-link") { draft.links.splice(idx, 1); renderRepeatSection("linkList", draft.links, "link"); }
    else if (action === "add-operator") { draft.operators.push({ name: "", url: "", contact: "" }); renderRepeatSection("operatorList", draft.operators, "operator"); }
    else if (action === "remove-operator") { draft.operators.splice(idx, 1); renderRepeatSection("operatorList", draft.operators, "operator"); }
    else if (action === "add-refLink") { draft.refLinks.push({ label: "", url: "" }); renderRepeatSection("refLinkList", draft.refLinks, "refLink"); }
    else if (action === "remove-refLink") { draft.refLinks.splice(idx, 1); renderRepeatSection("refLinkList", draft.refLinks, "refLink"); }
    else if (action === "remove-photo") { draft.photos.splice(idx, 1); renderPhotoGallery(); }
  });

  document.getElementById("modalBody").addEventListener("click", function (e) {
    if (e.target.dataset.action === "zoom") openLightbox(e.target.src);
  });

  function renderRepeatSection(containerId, items, kind) {
    document.getElementById(containerId).innerHTML = repeatListHtml(items, kind);
  }

  function renderPhotoGallery() {
    var gallery = document.getElementById("photoGallery");
    gallery.innerHTML = draft.photos.map(function (p, i) {
      return '<div class="photo-card" data-index="' + i + '">' +
        '<img src="' + p.dataUrl + '" data-action="zoom" alt="' + escapeHtml(p.caption || "Inspiration photo") + '" />' +
        '<input type="text" class="photo-caption" value="' + escapeHtml(p.caption) + '" placeholder="Caption" data-index="' + i + '" />' +
        '<button class="icon-btn" data-action="remove-photo" data-index="' + i + '">Remove</button>' +
      "</div>";
    }).join("");
  }

  document.getElementById("modalBody").addEventListener("input", function (e) {
    if (e.target.classList.contains("photo-caption")) {
      draft.photos[parseInt(e.target.dataset.index, 10)].caption = e.target.value;
    }
  });

  document.body.addEventListener("change", function (e) {
    if (e.target.id === "photoUpload") {
      var files = Array.prototype.slice.call(e.target.files);
      var remaining = files.length;
      if (!remaining) return;
      files.forEach(function (file) {
        var reader = new FileReader();
        reader.onload = function () {
          draft.photos.push({ dataUrl: reader.result, caption: "" });
          modalDirty = true;
          renderPhotoGallery();
        };
        reader.readAsDataURL(file);
      });
    }
  });

  function openLightbox(src) {
    document.getElementById("lightboxImg").src = src;
    document.getElementById("lightbox").hidden = false;
  }
  document.getElementById("lightbox").addEventListener("click", function () {
    this.hidden = true;
    document.getElementById("lightboxImg").src = "";
  });

  function collectRepeatRows(containerId, fields) {
    var rows = document.querySelectorAll("#" + containerId + " .repeat-row");
    return Array.prototype.map.call(rows, function (row) {
      var obj = {};
      fields.forEach(function (f) {
        var el = row.querySelector("." + f.cls);
        obj[f.key] = el ? el.value.trim() : "";
      });
      return obj;
    });
  }

  document.getElementById("saveTripBtn").addEventListener("click", function () {
    var title = document.getElementById("f-title").value.trim();
    if (!title) {
      toast("Give the trip a title before saving.");
      document.getElementById("f-title").focus();
      return;
    }
    draft.title = title;
    draft.status = document.getElementById("f-status").value;
    var yearVal = document.getElementById("f-year").value;
    draft.year = yearVal ? parseInt(yearVal, 10) : null;
    var monthVal = document.getElementById("f-month").value;
    draft.month = monthVal ? parseInt(monthVal, 10) : null;
    draft.dates = document.getElementById("f-dates").value.trim();
    draft.groupSize = document.getElementById("f-group").value.trim();
    draft.locations = document.getElementById("f-locations").value;
    draft.budget = {
      amount: document.getElementById("f-budget-amount").value.trim(),
      currency: document.getElementById("f-budget-currency").value,
      notes: document.getElementById("f-budget-notes").value.trim()
    };
    draft.links = collectRepeatRows("linkList", [{ key: "label", cls: "rl-label" }, { key: "url", cls: "rl-url" }]);
    draft.operators = collectRepeatRows("operatorList", [{ key: "name", cls: "op-name" }, { key: "url", cls: "op-url" }, { key: "contact", cls: "op-contact" }]);
    draft.refLinks = collectRepeatRows("refLinkList", [{ key: "label", cls: "rl-label" }, { key: "url", cls: "rl-url" }]);
    draft.notes = document.getElementById("f-notes").value;

    var existingIdx = state.trips.findIndex(function (t) { return t.id === draft.id; });
    if (existingIdx >= 0) state.trips[existingIdx] = draft;
    else state.trips.push(draft);

    modalDirty = false;
    closeModalConfirmed();
    render();
    toast("Saved " + title + ".");
  });

  document.getElementById("deleteTripBtn").addEventListener("click", function () {
    if (!confirm("Delete this trip? This can't be undone.")) return;
    state.trips = state.trips.filter(function (t) { return t.id !== draft.id; });
    closeModalConfirmed();
    render();
    toast("Trip deleted.");
  });

  render();
})();
</script>
</body>
</html>
